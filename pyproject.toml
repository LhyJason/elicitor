[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elicitor"
dynamic = ["version"]
description = "An LLM agent that chooses clarifying questions by expected information gain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pydantic>=2.7",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
elicitor = "elicitor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "elicitor.__version__" }

# The travel domain and the demo file go into the wheel under elicitor/bundled/, from where they
# are in the repo (SPEC Q21; `elicitor.resources` finds them). The package list is explicit
# because of that mapping: a new subpackage has to be added here.
[tool.setuptools]
packages = [
    "elicitor",
    "elicitor.analysis",
    "elicitor.experiments",
    "elicitor.llm",
    "elicitor.selectors",
    "elicitor.simulator",
    "elicitor.updaters",
    "elicitor.bundled.data",
    "elicitor.bundled.experiments",
]

[tool.setuptools.package-dir]
"" = "src"
"elicitor.bundled.data" = "data"
"elicitor.bundled.experiments" = "experiments"

[tool.setuptools.package-data]
"elicitor.bundled.data" = ["*/*", "*/prompts/*"]
"elicitor.bundled.experiments" = ["demo.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
