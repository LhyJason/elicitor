name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: elicitor make-data data/travel --check
      - run: elicitor run experiments/m1_no_llm.toml
      - run: elicitor run experiments/m2_mock.toml
      - run: elicitor run experiments/m3_eig.toml
      - run: elicitor run experiments/m3_mock.toml
