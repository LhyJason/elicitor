# M5 mock suite: every arm of the full run on the mock backend (SPEC §13, §17), including the
# Monte Carlo EIG arm (K = 5 only) and the LLM-phrasing ablation. Runs in CI; no server needed.
#   elicitor run experiments/m5_mock.toml --workers 4

name = "m5_mock"
domain = "travel"
data_dir = "../data"
split = "eval"
seed = 6000
replicates = 1
budgets = [3, 5]
tau = 0.9
selectors = ["fixed", "random", "max_entropy", "entropy_choice", "eig"]
updaters = ["rule", "llm"]
phrasers = ["tpl"]
extra_arms = ["sel=eig,upd=llm,phr=llm", "sel=eig_mc,upd=llm,phr=tpl"]

[arm_budgets]
"sel=eig_mc,upd=llm,phr=tpl" = [5]

[simulator]
kind = "llm"

[selector.eig]
rho = { open = 0.7, choice = 0.8, yesno = 0.9 }

[selector.entropy_choice]
rho = { open = 0.7, choice = 0.8, yesno = 0.9 }

[selector.eig_mc]
rho = { open = 0.7, choice = 0.8, yesno = 0.9 }
shortlist = 5
samples = 3

[updater.rule]
rho = { open = 0.7, choice = 0.8, yesno = 0.9 }

[llm]
provider = "mock"
