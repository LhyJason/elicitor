# M2 smoke run on a small local model (SPEC §17): dev personas only, one replicate.
# Needs Ollama running locally with the model pulled:  ollama pull qwen3:4b
#   elicitor run experiments/m2_smoke_ollama.toml
# Done when llm_stats.json shows 0 transport errors and 0 failed calls for every role.

name = "m2_smoke_ollama"
domain = "travel"
data_dir = "../data"
split = "dev"
seed = 3000
replicates = 1
budgets = [5]
tau = 0.9
selectors = ["max_entropy"]
updaters = ["rule", "llm"]
phrasers = ["tpl"]
extra_arms = ["sel=random,upd=llm,phr=llm"]

[simulator]
kind = "llm"

[updater.rule]
rho = 0.8

[llm]
provider = "ollama"
base_url = "http://127.0.0.1:11434"
num_ctx = 4096
timeout = 300

[llm.models]
agent = "qwen3:4b"
user = "qwen3:4b"
